# 1. Cấu hình cổng chạy ứng dụng (tránh đụng độ cổng 8080 nếu cần)
server.port=8080

# 2. Cấu hình kết nối MySQL (Thay db_session5, root, password của bạn vào đây)
spring.datasource.url=jdbc:mysql://localhost:3306/db_session5?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# 3. Cấu hình Hibernate tự động tạo bảng và hiển thị câu lệnh SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect